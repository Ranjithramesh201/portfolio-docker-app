name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Files
        run: ls -la

      - name: Show Docker Version
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build -t portfolio-app:v1 .